- case_name: Update missing user
  user_id: 999
  request_body:
    name: Nobody
    active: true
  expected_status_code: 404
  expected_body:
    detail: User not found

- case_name: Update user with empty name
  user_id: 1
  request_body:
    name: ""
    active: true
  expected_status_code: 422

- case_name: Update user without active
  user_id: 1
  request_body:
    name: Updated Name
  expected_status_code: 422

- case_name: Update user without name
  user_id: 1
  request_body:
    active: false
  expected_status_code: 422